# Trusted publishing (OIDC) → npm with provenance. No NPM_TOKEN.
#
# Configure once on npmjs.com (Package → Settings → Trusted Publisher):
#   Org/user: Catalyst-Forge-LLC
#   Repository: finetuna
#   Workflow filename: publish.yml
#   Environment: npm  (must match `environment:` below)
#   Allowed actions: npm publish
#
# Release flow:
#   1. Bump package.json version + commit/push to default branch
#   2. Create a GitHub Release (tag vX.Y.Z) — or run this workflow_dispatch
#   3. Confirm: npm view finetuna dist.attestations
#   Do NOT `npm publish` / `pnpm publish` from a laptop — that skips OIDC + provenance.
#
# Docs: https://docs.npmjs.com/trusted-publishers/
#       https://docs.npmjs.com/generating-provenance-statements/
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # OIDC auth requires no NODE_AUTH_TOKEN (a token makes npm skip OIDC).
      # --provenance is explicit; trusted publishing also enables it by default on npm ≥ 11.5.1.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
